<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pg-index" onload="overflow()">
    <header>
        <div class="triangulo-vermelho"></div>
        <div class="index-conteudo">
            <div class="header-principal">
                <h1 id="cantina">CANTINA</h1>
                <div class="index-caixa-branca">
                    <img src="img/senai.jpg" alt="" id="senai-img">
                </div>
            </div>
    </header>

    <main>
        <div class='index-caixa-pedido'>
            <h1>FAÇA SEU PEDIDO</h1>
            <form>
                <div class="index-caixa-pedido-superior">
                    <input type="text" placeholder="Seu Nome" required id="nomePedido">
                    <p>INSIRA UM NOME <br> PARA COMEÇAR</p>
                </div>
                <div class="index-caixa-pedido-inferior">
                    <button type="button" id="iniciaPedido" onclick="iniciarPedido()">INICIAR PEDIDO</button>
                </div>
            </form>
        </div>

        <div class="index-comidas-agrupadas">
            <img src="img/imgIndex/pepsi.jpg" alt="">
            <img src="img/imgIndex/hamburguer.jpg" alt="">
            <img src="img/imgIndex/esfiha.jpg" alt="">
            <img src="img/imgIndex/hotdog.jpg" alt="">
            <img src="img/imgIndex/coca.jpg" alt="">
        </div>
        <div class="quadrado-vermelho"></div>
        </div>
    </main>

    <script src="_js/global.js"></script>
    <script src="_js/script.js"></script>
</body>


</html>
