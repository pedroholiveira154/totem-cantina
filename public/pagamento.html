<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantina - Pagamento</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pagina-pagamento" class="pagina-etapa">
    <header class="cabecalho">
        <div class="triangulo-vermelho" aria-hidden="true"></div>
        <div class="conteudo-cabecalho">
            <p class="marca-cantina">CANTINA</p>
            <div class="moldura-logo">
                <img src="img/senai.jpg" alt="SENAI" class="logo-senai">
            </div>
        </div>
    </header>

    <main class="painel-pagina">
        <div class="barra-superior">
            <h1 class="somente-leitor-tela">Pagamento</h1>
            <button type="button" onclick="retornar()" class="botao-voltar">Voltar</button>
        </div>

        <section class="painel-etapa" aria-label="Forma de pagamento">
            <div id="resumo-total-pagamento">
                <p>Total a pagar:</p>
                <div id="preco-total"></div>
                <p>Insira a forma de pagamento:</p>
            </div>

            <div id="opcoes-pagamento">
                <button type="button" class="botao-forma-pagamento" id="pagamento-debito">Débito</button>
                <button type="button" class="botao-forma-pagamento" id="pagamento-credito">Crédito</button>
                <button type="button" class="botao-forma-pagamento" id="pagamento-dinheiro">Dinheiro</button>
                <button type="button" class="botao-forma-pagamento" id="pagamento-pix">Pix</button>
                <button type="button" class="botao-forma-pagamento" id="pagamento-vale-refeicao">Vale Refeição</button>
            </div>
        </section>
    </main>

    <div class="barra-acao">
        <button type="button" onclick="pagar()" class="botao-acao">PAGAR</button>
    </div>

    <script src="_js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
