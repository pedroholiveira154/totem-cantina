<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pagina-pagamento" onload="overflow()">
    <header>
        <div class="triangulo-vermelho"></div>
        <div class="index-conteudo">
            <div class="header-principal">
                <h1 id="cantina">CANTINA</h1>
                <div class="index-caixa-branca">
                    <img src="img/senai.jpg" alt="" id="senai-img">
                </div>
            </div>
    </header>

    <main>
        <div class="caixaSubPrincipal">
            <button onclick="retornar()" class="btn-voltar">Voltar</button>
            <div class="caixaPrincipal">
                <div id="caixaPrecoTotal">
                    <p>Total a pagar:</p>
                    <p id="preco-total"></p>
                    <p>Insira a forma de pagamento:</p>
                </div>
                <div id="opcoesPagamento">
                    <button class="formaPagamento" id="pagamentoDebito">
                        <p>Débito</p>
                    </button>
                    <button class="formaPagamento" id="pagamentoCredito">
                        <p>Crédito</p>
                    </button>
                    <button class="formaPagamento" id="pagamentoDinheiro">
                        <p>Dinheiro</p>
                    </button>
                    <button class="formaPagamento" id="pagamentoPix">
                        <p>Pix</p>
                    </button>
                    <button class="formaPagamento" id="pagamentoValeR">
                        <p>Vale Refeição</p>
                    </button>
                </div>
            </div>
            <button class="btn-pagamentoEpagar">Pagar</button>
        </div>
    </main>

    <script src="_js/global.js"></script>
    <script src="_js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>


</html>
