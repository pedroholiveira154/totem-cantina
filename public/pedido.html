<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PEDIDO</title>
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pagina-pedido">
    <header>
        <div class="triangulo-vermelho"></div>
        <div class="index-conteudo">
            <div class="header-principal">
                <h1 id="cantina">CANTINA</h1>
                <div class="index-caixa-branca">
                    <img src="img/senai.jpg" alt="" id="senai-img">
                </div>
            </div>
    </header>

    <main>
        <div class="caixaPrincipal">
            <button onclick="retornar()" class="btn-voltar">Voltar</button>
            <div class="caixaSubPrincipal">
                <div id="lista-produtos"></div>
                <div id="preco-total"></div>
            </div>
        </div>
        <button onclick="redirecionarPagamento()" class="btn-pagamentoEpagar">PAGAR</button>
    </main>

    <script src="_js/global.js"></script>
    <script src="_js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
