<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - FilaZero</title>
    <link rel="stylesheet" href="_css/admin.css">
</head>

<body background="img/imgAdmin/FundoAdmin.png">

```
<div class="corpoCadastro">

    <div class="cadastroProduto">

        <h1 id="ttestoque">CADASTRAR PRODUTO</h1>

        <form id="formProduto">

            <div class="campo">
                <label>Nome do Produto</label>
                <input type="text" id="nomeProduto" required>
            </div>

            <div class="campo">
                <label>Quantidade em Estoque</label>
                <input type="number" id="estoqueProduto" required>
            </div>

            <div class="campo">
                <label>Preço</label>
                <input type="number" step="0.01" id="precoProduto" required>
            </div>

            <div class="campo">
                <label>Categoria</label>
                <select id="categoriaProduto">
                    <option>Salgados</option>
                    <option>Bebidas</option>
                    <option>Sobremesas</option>
                    <option>Lanches</option>
                </select>
            </div>

            <div class="campo">
                <label>Imagem do Produto</label>
                <input type="file" id="imagemProduto">
            </div>

            <div class="botoesCadastro">
                <button type="submit" id="bot">SALVAR PRODUTO</button>
                <button type="button" id="bot" onclick="window.location.href='estoque.html'">
                    VOLTAR
                </button>
            </div>

        </form>

    </div>

</div>

<script>
    document.getElementById("formProduto").addEventListener("submit", function(e){

        e.preventDefault();

        const produto = {
            nome: document.getElementById("nomeProduto").value,
            estoque: document.getElementById("estoqueProduto").value,
            preco: document.getElementById("precoProduto").value,
            categoria: document.getElementById("categoriaProduto").value
        };

        console.log(produto);

        alert("Produto cadastrado com sucesso!");

        this.reset();
    });
</script>
```

</body>
</html>
