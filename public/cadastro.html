<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto - FilaZero</title>
    <link rel="stylesheet" href="_css/admin.css">
</head>

<body id="pagina-cadastro-produto" class="pagina-admin">

    <main class="area-cadastro">

        <section class="painel-cadastro-produto" aria-labelledby="titulo-cadastro">

            <h1 id="titulo-cadastro" class="titulo-painel">CADASTRAR PRODUTO</h1>

            <form id="formProduto">

                <div class="campo">
                    <label for="nomeProduto">Nome do Produto</label>
                    <input type="text" id="nomeProduto" required>
                </div>

                <div class="campo">
                    <label for="estoqueProduto">Quantidade em Estoque</label>
                    <input type="number" id="estoqueProduto" required>
                </div>

                <div class="campo">
                    <label for="precoProduto">Preço</label>
                    <input type="number" step="0.01" id="precoProduto" required>
                </div>

                <div class="campo">
                    <label for="categoriaProduto">Categoria</label>
                    <select id="categoriaProduto">
                        <option>Salgados</option>
                        <option>Bebidas</option>
                        <option>Sobremesas</option>
                        <option>Lanches</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="imagemProduto">Imagem do Produto</label>
                    <input type="file" id="imagemProduto">
                </div>

                <div class="acoes-cadastro">
                    <button type="submit" class="botao-admin">SALVAR PRODUTO</button>
                    <button type="button" class="botao-admin" onclick="window.location.href='estoque.html'">
                        VOLTAR
                    </button>
                </div>

            </form>

        </section>

    </main>

    <script>
        document.getElementById("formProduto").addEventListener("submit", function(e){

            e.preventDefault();

            const produto = {
                nome: document.getElementById("nomeProduto").value,
                estoque: document.getElementById("estoqueProduto").value,
                preco: document.getElementById("precoProduto").value,
                categoria: document.getElementById("categoriaProduto").value
            };

            console.log(produto);

            alert("Produto cadastrado com sucesso!");

            this.reset();
        });
    </script>

</body>

</html>
