<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FilaZero</title>
    <link rel="stylesheet" href="_css/admin.css">
</head>

<body id="pagina-login" class="pagina-admin">

    <main class="painel-login">
        <h1 id="titulo-login">LOGIN</h1>

        <input id="usuario" type="text" placeholder="Usuário" aria-label="Usuário" autocomplete="username">

        <input id="senha" type="password" placeholder="Senha" aria-label="Senha" autocomplete="current-password">

        <button id="botao-login" type="button" onclick="acessar()">LOGIN</button>

        <p class="texto-direitos">@Todos direitos reservados.</p>
    </main>

    <script>
        function acessar() {
            var usuario = document.getElementById('usuario').value;
            var senha = document.getElementById('senha').value;

            if(usuario === "Admin" && senha === "123") {
                window.location.href = "estoque.html"
            }else {
                alert("Usuário ou Senha Incorretos")
            }
        }
    </script>

</body>

</html>
