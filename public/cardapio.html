<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Cardapio</title>
    <link rel="stylesheet" href="_css/style.css">
</head>

<body id="pagina-cardapio">
    <header>
        <div class="triangulo-vermelho"></div>
        <div class="index-conteudo">
            <div class="header-principal">
                <h1 id="cantina">CANTINA</h1>
                <div class="index-caixa-branca">
                    <img src="img/senai.jpg" alt="" id="senai-img">
                </div>
            </div>
    </header>

    <main>
        <div class="caixaSubPrincipal">
            <div class="cardapio-header">
                <h1>Olá, <span id="nome-cliente"></span><span id="exclamacao">!!!</span> </h1>
                <button onclick="retornar()" class="btn-voltar">Voltar</button>
            </div>

            <div class="cardapio-conteudo">
                <aside class="cardapio-sidebar">
                    <!-- <p>Categorias</p> -->
                    <ul>
                        <li class="ativo" data-categoria="4">Mais Vendidos</li>
                        <li data-categoria="5">Lançamentos</li>
                        <li data-categoria="1">Salgados</li>
                        <li data-categoria="2">Bebidas</li>
                        <li data-categoria="3">Sobremesas</li>
                    </ul>
                </aside>
                
                <div class="cardapio">
                    <div id="cardapio"></div>
                </div>
            </div>
        </div>
    </main>

    <footer id="cardapioFooter">
        <button onclick="direcionarPedido()">IR AO CARRINHO</button>
    </footer>

    <script src="_js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
