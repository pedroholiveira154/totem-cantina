
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque</title>
    <link rel="stylesheet" href="/style.css">
        <style>
        
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #1f2937;
}

.container {
    width: min(94%, 1000px);
    margin: 40px auto;
}

.card {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    box-shadow: 0 4px 18px rgb(0 0 0 / 8%);
}

h1 {
    margin-top: 0;
}

form {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 1rem;
}

button {
    padding: 10px 14px;
    border: 0;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    cursor: pointer;
    margin: 2px;
}

button:hover {
    background: #1d4ed8;
}

button:disabled {
    opacity: 0.6;
    cursor: wait;
}

.cabecalho {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
}

.tabela-container {
    width: 100%;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
}

th,
td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #e5e7eb;
}

#mensagem {
    overflow-wrap: anywhere;
}

@media (max-width: 600px) {
    .container {
        margin: 20px auto;
    }

    .card {
        padding: 16px;
    }

    th,
    td {
        padding: 8px;
    }
}
    </style>
    <script src="/estoque.js" defer></script>
</head>
<body>
    <main class="container">
        <section class="card">
            <header class="cabecalho">
                <div>
                    <h1>Estoque</h1>
                    <p id="usuario-logado">Verificando sessão...</p>
                </div>

                <button type="button" id="btn-sair">
                    Sair
                </button>
            </header>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <div class="tabela-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Movimentação</th>
                        </tr>
                    </thead>
                    <tbody id="lista-produtos"></tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
